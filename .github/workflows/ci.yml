name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Detect docs-only changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

      - name: Docs-only summary
        if: steps.changes.outputs.code == 'false'
        run: echo "只改文件，略過建置" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v6
        if: steps.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.changes.outputs.code == 'true'

      - name: Make gradlew executable
        if: steps.changes.outputs.code == 'true'
        run: chmod +x gradlew

      - name: Compile and test
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew compileKotlinDesktop compileKotlinJs desktopTest --stacktrace --warning-mode all

      - name: Build JS distribution
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew jsBrowserDistribution --stacktrace --warning-mode all

      - name: Check HUD icons are packaged in JS distribution
        if: steps.changes.outputs.code == 'true'
        run: |
          diff <(cd koolApp/assets/icons && ls *.svg | sort) \
               <(cd koolApp/build/dist/js/productionExecutable/assets/icons && ls *.svg | sort)

      - name: Upload JS distribution
        if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: js-distribution
          path: koolApp/build/dist/js/productionExecutable
          if-no-files-found: error

      - name: Upload test reports
        if: failure() && steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
