name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile and test
        run: ./gradlew compileKotlinDesktop compileKotlinJs desktopTest --stacktrace

      - name: Build JS distribution
        run: ./gradlew jsBrowserDistribution --stacktrace

      - name: Check HUD icons are packaged in JS distribution
        run: |
          diff <(cd koolApp/assets/icons && ls *.svg | sort) \
               <(cd koolApp/build/dist/js/productionExecutable/assets/icons && ls *.svg | sort)

      - name: Upload JS distribution
        uses: actions/upload-artifact@v7
        with:
          name: js-distribution
          path: koolApp/build/dist/js/productionExecutable
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
